<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>GrapesJS Preset Webpage</title>
    
    <link href="https://unpkg.com/grapesjs/dist/css/grapes.min.css" rel="stylesheet">
    <link href="dist/ezygrapes-preset-webpage.min.css" rel="stylesheet">
    <script src="lib/grapes.min.js"></script>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="gjs" style="height:0px; overflow:hidden">
        <div class="panel">
            <h1 class="welcome">Welcome to</h1>
            <div class="big-title">
                <svg class="logo" viewBox="0 0 100 100">
                    <path d="M40 5l-12.9 7.4 -12.9 7.4c-1.4 0.8-2.7 2.3-3.7 3.9 -0.9 1.6-1.5 3.5-1.5 5.1v14.9 14.9c0 1.7 0.6 3.5 1.5 5.1 0.9 1.6 2.2 3.1 3.7 3.9l12.9 7.4 12.9 7.4c1.4 0.8 3.3 1.2 5.2 1.2 1.9 0 3.8-0.4 5.2-1.2l12.9-7.4 12.9-7.4c1.4-0.8 2.7-2.2 3.7-3.9 0.9-1.6 1.5-3.5 1.5-5.1v-14.9 -12.7c0-4.6-3.8-6-6.8-4.2l-28 16.2"/>
                </svg>
                <span>GrapesJS</span>
            </div>
            <div class="description">
                This is a demo content from index.html. For the development, you shouldn't edit this file, instead you
                can
                copy and rename it to _index.html, on next server start the new file will be served, and it will be
                ignored by git.
            </div>
        </div>
        <style>
            .panel {
                width: 90%;
                max-width: 700px;
                border-radius: 3px;
                padding: 30px 20px;
                margin: 150px auto 0px;
                background-color: #d983a6;
                box-shadow: 0px 3px 10px 0px rgba(0, 0, 0, 0.25);
                color: rgba(255, 255, 255, 0.75);
                font: caption;
                font-weight: 100;
            }

            .welcome {
                text-align: center;
                font-weight: 100;
                margin: 0px;
            }

            .logo {
                width: 70px;
                height: 70px;
                vertical-align: middle;
            }

            .logo path {
                pointer-events: none;
                fill: none;
                stroke-linecap: round;
                stroke-width: 7;
                stroke: #fff
            }

            .big-title {
                text-align: center;
                font-size: 3.5rem;
                margin: 15px 0;
            }

            .description {
                text-align: justify;
                font-size: 1rem;
                line-height: 1.5rem;
            }
        </style>
    </div>

    <script defer type="text/javascript">
        document.addEventListener("DOMContentLoaded", function(event) { 
            var editor = ezygrapes.init({
                height: '100%',
                showOffsets: 1,
                noticeOnUnload: 0,
                cssIcons: 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css',
                storageManager: {autoload: 0},
                container: '#gjs',
                fromElement: true,

                plugins: ['gjs-preset-webpage'],
                pluginsOpts: {
                    'gjs-preset-webpage': {}
                },
                i18n: {
                    locale: 'vi',
                    localeFallback: 'vi',
                    detectLocale: false,
                },
                canvas: {
                    styles: [
                        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css',
                        'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'
                    ],
                    scripts: [
                        'https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js',
                        'https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/js/bootstrap.bundle.min.js',
                    ],
                }
            });
            editor.on('component:selected', model => {
                if (model.is('image')) {
                    const sm = editor.StyleManager;
                    const sector = sm.getSector('extra') || sm.addSector('extra', { name: 'Extra', open: true });
                    const propertyExists = sector.getProperties().some(prop => prop.get('property') === 'object-fit');
                    if (!propertyExists) {
                        sm.addProperty(sector.getId(), {
                            name: 'Object Fit',
                            property: 'object-fit',
                            type: 'select',
                            defaults: 'cover',
                            full: true,
                            style: { height: '60px' },
                            options: [
                                { value: 'fill', name: 'fill' },
                                { value: 'contain', name: 'contain' },
                                { value: 'cover', name: 'cover' },
                                { value: 'none', name: 'none' },
                                { value: 'scale-down', name: 'scale-down' }
                            ]
                        });
                    }
                }
            });
        });
    </script>
</body>
</html>
